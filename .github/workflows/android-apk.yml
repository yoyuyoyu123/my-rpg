name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/android-apk]
    paths: ['android/**', 'backend/app/**', 'index.html', 'data/worlds/**', 'research/*.json', 'tools/prepare_android.py', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', 'backend/app/**', 'index.html', 'data/worlds/**', 'research/*.json', 'tools/prepare_android.py', '.github/workflows/android-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build standalone phone APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wuji-rpg-android-arm64-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
