# Set a unique app name with `fly launch --no-deploy`, or pass --app to fly deploy.
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "120s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  WUJI_SITE_AUTH_ENABLED = "true"
  WUJI_SITE_SECURE_COOKIES = "true"
  WUJI_DATA_DIR = "/data"
  WUJI_CONFIG_FILE = "/data/runtime.env"

[[mounts]]
  source = "wuji_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
